name: LittleAcornForest
options:
  bundleIdPrefix: com.quoguri.littleacornforest
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  AcornForestCore:
    path: Packages/AcornForestCore
targets:
  LittleAcornForest:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: AcornForestCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "도토리 숲"
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDefault
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quoguri.littleacornforest.app
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_EMIT_LOC_STRINGS: YES
  LittleAcornForestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LittleAcornForest
      - package: AcornForestCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quoguri.littleacornforest.app.tests
schemes:
  LittleAcornForest:
    build:
      targets:
        LittleAcornForest: all
        LittleAcornForestTests: [test]
    test:
      targets:
        - LittleAcornForestTests
    run:
      config: Debug
